name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @dymcode/widget build
      - run: pnpm --filter @dymcode/widget size
      - run: pnpm --filter @dymcode/widget check:bundle
      - run: pnpm --filter @dymcode/web build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dymcode/widget exec playwright install --with-deps chromium
      - run: pnpm --filter @dymcode/widget e2e
      - run: pnpm --filter @dymcode/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dymcode/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: widget-e2e-report
          path: |
            packages/widget/playwright-report
            packages/widget/test-results
            apps/web/playwright-report
            apps/web/test-results

  db-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:test
        env:
          DB_TEST_TARGET: supabase
      - run: pnpm --filter @dymcode/web test
        env:
          DB_TEST_TARGET: supabase
